<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salalah</title>
<style>
    body {
        background-color: beige; 
        font-family: Arial, sans-serif;
    }

    #myIframe {
        position: absolute;
        top: 0;
        right: 0;
        width: 600px; 
        height: 500px; 
        border: 4px solid brown;
    }

    
    h2 {
    margin-left: 100px; 
    border: 2px solid brown; 
    padding: 10px; 
    display: inline-block; 
   }

    .photo-container {
        margin-top: 100px; 
    }

    .photo-container-item {
        display: inline-block;
        margin-right: 20px;
        text-align: center;
    }

    .photo {
        width: 200px; 
        margin-bottom: 1px; 
        border-radius: 8px; 
    }

    .photo-description {
        text-align: center;
        font-style: italic;
    }

    .back-button {
        text-align: center;
        position: fixed;
        bottom: 20px; 
        left: 20px; 
    }

    .back-button a {
        display: inline-block;
        padding: 10px 20px; 
        background-color: #4CAF50; 
        color: white; 
        text-decoration: none; 
        border-radius: 5px; 
        transition: background-color 0.3s; 
    }

    .back-button a:hover {
        background-color: #45a049;
    }
</style>
</head>
<body>

<h2>Enjoy The Most Beautiful Views In Salalah</h2>

<div class="photo-container">
    <div class="photo-container-item">
        <img class="photo" src="sa1.jpeg" alt="Photo 1">
        <p class="photo-description">Green landscapes</p>
    </div>
    
    <div class="photo-container-item">
        <img class="photo" src="sa2.jpeg" alt="Photo 2">
        <p class="photo-description">Beautiful waterfalls</p>
    </div>
    
    <div class="photo-container-item">
        <img class="photo" src="sa3.jpeg" alt="Photo 3">
        <p class="photo-description">Many beautiful landscapes</p>
    </div>
</div>

<iframe id="myIframe" src="https://www.memphistours.com/Oman/Oman-Travel-Guide/Cities-in-Oman/wiki/Salalah-City"></iframe>

<div class="back-button">
    <a href="travel.html">Home Page</a>
</div>

</body>
</html>
